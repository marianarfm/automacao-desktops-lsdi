---
# Configuração geral
desktop_cache_valid_time: 3600
desktop_download_dir: /var/cache/desktop-software
desktop_upgrade_all_system_packages: true
desktop_apt_package_state: latest
desktop_manage_profile_script: true
desktop_enabled_services: []
desktop_repo_prerequisites:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - software-properties-common

# Variáveis exportadas para sessões de usuário
desktop_profile_exports:
  - name: ESPER_HOME
    value: /opt/esper/current

# Configuração do modo pull
desktop_pull_repo_url: https://github.com/marianarfm/automacao-desktops-lsdi.git
desktop_pull_repo_branch: main
desktop_pull_playbook: playbooks/desktop.yml
desktop_pull_destination: /opt/ansible-pull/repo
desktop_pull_interval: 12h
desktop_pull_randomized_delay: 20m
desktop_pull_run_immediately: false
desktop_pull_extra_args: ""

# Interruptores centrais de instalação, manutenção e remoção
# Futuras manutenções do catálogo devem começar por esta seção
desktop_managed_apps_enabled:
  # Linguagens, compiladores e toolchains
  git: true
  python3: true
  python3_pip: true
  python3_venv: true
  openjdk_17: true
  gcc: true
  gxx: true
  nodejs: true
  npm: true
  dotnet_sdk_8: true

  # IDEs e ferramentas de desenvolvimento
  vscode: true
  intellij_idea_community: true
  pycharm_community: true
  clion: true
  eclipse_ide: true
  arduino_ide: true
  android_studio: true
  android_sdk: true

  # Bancos, redes e integrações
  postgresql: true
  postgresql_client: true
  pgadmin4_desktop: true
  mysql_server: true
  mysql_workbench_community: true
  mongodb_org: true
  docker_ce: true
  docker_ce_cli: true
  containerd_io: true
  docker_buildx_plugin: true
  docker_compose_plugin: true
  mqttx: true
  postman: true

  # Aplicativos de produtividade e uso geral
  google_chrome: true
  libreoffice: true
  krita: true
  texstudio: true
  texlive_latex_recommended: true
  texlive_latex_extra: true
  texlive_fonts_recommended: true

  # Ferramentas científicas e utilitários adicionais
  anaconda: true
  jupyter_notebook: true
  esper: true

# Metadados específicos dos aplicativos que exigem versionamento manual

# Android Studio requer aceite explícito da licença do fornecedor
desktop_android_studio:
  license_accepted: true
  version: 2025.3.4
  build: 2025.3.4.6
  linux_archive_file: android-studio-panda4-linux.tar.gz
  linux_checksum: sha256:32a7ff09acaa38b48d61c8882bee7e213022a8ba0d1f16c0073380facb509fd3

desktop_android_sdk:
  enabled: "{{ desktop_managed_apps_enabled.android_sdk | bool }}"
  path: /opt/android-sdk
  cmdline_tools_version: "14742923"
  cmdline_tools_url: https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
  cmdline_tools_filename: "commandlinetools-linux-{{ desktop_android_sdk.cmdline_tools_version }}_latest.zip"
  cmdline_tools_release_dir: "{{ desktop_android_sdk.cmdline_tools_version }}"
  cmdline_tools_checksum: ""
  prerequisite_packages:
    - unzip
  accept_licenses: true
  packages:
    - platform-tools
    - build-tools;35.0.0
    - platforms;android-35
  symlinks:
    - source_relpath: cmdline-tools/latest/bin/sdkmanager
      command_name: sdkmanager
    - source_relpath: cmdline-tools/latest/bin/avdmanager
      command_name: avdmanager
    - source_relpath: platform-tools/adb
      command_name: adb

desktop_eclipse_ide:
  release: 2026-03-R
  linux_archive_file: eclipse-java-2026-03-R-linux-gtk-x86_64.tar.gz

desktop_postman:
  release_dir_name: postman-latest

desktop_anaconda:
  version: 2025.06-1
  installer_filename: "Anaconda3-{{ desktop_anaconda.version }}-Linux-x86_64.sh"
  release_dir_name: "anaconda3-{{ desktop_anaconda.version }}"

desktop_mqttx:
  version: 1.13.0
  deb_filename: "MQTTX_{{ desktop_mqttx.version }}_amd64.deb"

# Repositórios oficiais de terceiros usados pelo APT
desktop_apt_repositories:
  - name: vscode
    key_url: https://packages.microsoft.com/keys/microsoft.asc
    key_path: /etc/apt/keyrings/microsoft.asc
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.asc] https://packages.microsoft.com/repos/code stable main"
    filename: vscode

  - name: docker
    key_url: https://download.docker.com/linux/ubuntu/gpg
    key_path: /etc/apt/keyrings/docker.asc
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
    filename: docker

  - name: google-chrome
    key_url: https://dl.google.com/linux/linux_signing_key.pub
    key_path: /etc/apt/keyrings/google-chrome.asc
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.asc] https://dl.google.com/linux/chrome/deb/ stable main"
    filename: google-chrome

  - name: pgadmin4
    key_url: https://www.pgadmin.org/static/packages_pgadmin_org.pub
    key_path: /etc/apt/keyrings/packages-pgadmin-org.asc
    repo: "deb [signed-by=/etc/apt/keyrings/packages-pgadmin-org.asc] https://ftp.postgresql.org/pub/pgadmin/pgadmin4/apt/{{ ansible_facts['distribution_release'] }} pgadmin4 main"
    filename: pgadmin4
    enabled: "{{ ansible_facts['distribution_release'] in ['jammy', 'noble'] }}"

  - name: mongodb-org
    key_url: https://pgp.mongodb.com/server-8.0.asc
    key_path: /etc/apt/keyrings/mongodb-server-8.0.asc
    repo: "deb [arch=amd64,arm64 signed-by=/etc/apt/keyrings/mongodb-server-8.0.asc] https://repo.mongodb.org/apt/ubuntu {{ ansible_facts['distribution_release'] }}/mongodb-org/8.0 multiverse"
    filename: mongodb-org-8.0
    enabled: "{{ ansible_facts['distribution_release'] in ['jammy', 'noble'] }}"

  - name: mysql-tools
    key_url: https://repo.mysql.com/RPM-GPG-KEY-mysql-2025
    key_path: /etc/apt/keyrings/mysql-2025.asc
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/mysql-2025.asc] http://repo.mysql.com/apt/ubuntu/ {{ ansible_facts['distribution_release'] }} mysql-tools"
    filename: mysql-tools
    enabled: "{{ desktop_managed_apps_enabled.mysql_workbench_community | bool and ansible_facts['distribution_release'] in ['jammy', 'noble'] }}"

# Remove definições antigas ou conflitantes dos mesmos repositórios
desktop_apt_repo_cleanup_rules:
  - name: vscode
    match: https://packages.microsoft.com/repos/code
    managed_filenames:
      - vscode.list

# Lista reservada para pacotes internos
desktop_apt_packages: []

# Catálogo de pacotes APT que seguem o modelo de enabled/disabled
desktop_optional_apt_apps:
  # Ferramentas básicas
  - package_name: git
    enabled: "{{ desktop_managed_apps_enabled.git | bool }}"
  - package_name: python3
    enabled: "{{ desktop_managed_apps_enabled.python3 | bool }}"
  - package_name: python3-pip
    enabled: "{{ desktop_managed_apps_enabled.python3_pip | bool }}"
  - package_name: python3-venv
    enabled: "{{ desktop_managed_apps_enabled.python3_venv | bool }}"
  - package_name: openjdk-17-jdk
    enabled: "{{ desktop_managed_apps_enabled.openjdk_17 | bool }}"
  - package_name: gcc
    enabled: "{{ desktop_managed_apps_enabled.gcc | bool }}"
  - package_name: g++
    enabled: "{{ desktop_managed_apps_enabled.gxx | bool }}"
  - package_name: nodejs
    enabled: "{{ desktop_managed_apps_enabled.nodejs | bool }}"
  - package_name: npm
    enabled: "{{ desktop_managed_apps_enabled.npm | bool }}"
  - package_name: dotnet-sdk-8.0
    enabled: "{{ desktop_managed_apps_enabled.dotnet_sdk_8 | bool }}"

  # IDEs e utilitários de desenvolvimento via APT
  - package_name: code
    enabled: "{{ desktop_managed_apps_enabled.vscode | bool }}"
  - package_name: docker-ce
    enabled: "{{ desktop_managed_apps_enabled.docker_ce | bool }}"
  - package_name: docker-ce-cli
    enabled: "{{ desktop_managed_apps_enabled.docker_ce_cli | bool }}"
  - package_name: containerd.io
    enabled: "{{ desktop_managed_apps_enabled.containerd_io | bool }}"
  - package_name: docker-buildx-plugin
    enabled: "{{ desktop_managed_apps_enabled.docker_buildx_plugin | bool }}"
  - package_name: docker-compose-plugin
    enabled: "{{ desktop_managed_apps_enabled.docker_compose_plugin | bool }}"

  # Navegação e produtividade
  - package_name: google-chrome-stable
    enabled: "{{ desktop_managed_apps_enabled.google_chrome | bool }}"
  - package_name: libreoffice
    enabled: "{{ desktop_managed_apps_enabled.libreoffice | bool }}"
  - package_name: krita
    enabled: "{{ desktop_managed_apps_enabled.krita | bool }}"
  - package_name: texstudio
    enabled: "{{ desktop_managed_apps_enabled.texstudio | bool }}"
  - package_name: texlive-latex-recommended
    enabled: "{{ desktop_managed_apps_enabled.texlive_latex_recommended | bool }}"
  - package_name: texlive-latex-extra
    enabled: "{{ desktop_managed_apps_enabled.texlive_latex_extra | bool }}"
  - package_name: texlive-fonts-recommended
    enabled: "{{ desktop_managed_apps_enabled.texlive_fonts_recommended | bool }}"

  # Bancos de dados e ferramentas associadas
  - package_name: postgresql
    enabled: "{{ desktop_managed_apps_enabled.postgresql | bool }}"
  - package_name: postgresql-client
    enabled: "{{ desktop_managed_apps_enabled.postgresql_client | bool }}"
  - package_name: pgadmin4-desktop
    enabled: "{{ desktop_managed_apps_enabled.pgadmin4_desktop | bool }}"
    supported_releases:
      - jammy
      - noble
  - package_name: mysql-server
    enabled: "{{ desktop_managed_apps_enabled.mysql_server | bool }}"
  - package_name: mysql-workbench-community
    enabled: "{{ desktop_managed_apps_enabled.mysql_workbench_community | bool }}"
    skip_if_unavailable: true # Nem todos os lançamentos do MySQL Workbench estão disponíveis para todas as versões do Ubuntu, então esta flag evita falhas caso o pacote não exista em algum lançamento específico
    supported_releases:
      - jammy
      - noble
  - package_name: mongodb-org
    enabled: "{{ desktop_managed_apps_enabled.mongodb_org | bool }}"
    supported_releases:
      - jammy
      - noble

# Derivados automáticos para instalar ou remover pacotes APT
desktop_additional_apt_packages: >-
  {{
    desktop_optional_apt_apps
    | selectattr('enabled', 'truthy')
    | rejectattr('supported_releases', 'defined')
    | map(attribute='package_name')
    | list
    +
    (
      desktop_optional_apt_apps
      | selectattr('enabled', 'truthy')
      | selectattr('supported_releases', 'defined')
      | selectattr('supported_releases', 'contains', ansible_facts['distribution_release'])
      | map(attribute='package_name')
      | list
    )
  }}

desktop_absent_apt_packages: >-
  {{
    desktop_optional_apt_apps
    | rejectattr('enabled', 'truthy')
    | rejectattr('supported_releases', 'defined')
    | map(attribute='package_name')
    | list
    +
    (
      desktop_optional_apt_apps
      | rejectattr('enabled', 'truthy')
      | selectattr('supported_releases', 'defined')
      | selectattr('supported_releases', 'contains', ansible_facts['distribution_release'])
      | map(attribute='package_name')
      | list
    )
  }}

# Aplicativos Python isolados em ambientes virtuais próprios
desktop_python_venv_apps:
  - name: jupyter-notebook
    enabled: "{{ desktop_managed_apps_enabled.jupyter_notebook | bool }}"
    path: /opt/jupyter-notebook
    packages:
      - notebook
    launcher_name: jupyter-notebook
    entrypoint: jupyter-notebook

# Aplicativos distribuídos como arquivos compactados
desktop_archive_apps:
  - name: android-studio
    url: "https://edgedl.me.gvt1.com/android/studio/ide-zips/{{ desktop_android_studio.build }}/{{ desktop_android_studio.linux_archive_file }}"
    checksum: "{{ desktop_android_studio.linux_checksum }}"
    archive_file: "{{ desktop_android_studio.linux_archive_file }}"
    install_root: /opt/android-studio
    release_dir_name: "android-studio-{{ desktop_android_studio.version }}"
    extracted_dir_name: android-studio
    binary_relpath: bin/studio.sh
    command_name: android-studio
    min_free_mb: 8192
    enabled: "{{ desktop_managed_apps_enabled.android_studio | bool }}"
    requires_explicit_license_acceptance: true
    license_accepted: "{{ desktop_android_studio.license_accepted | bool }}"
    unarchive_extra_opts:
      - --strip-components=1
    desktop:
      name: Android Studio
      icon_relpath: bin/studio.svg
      categories: Development;IDE;
      startup_wm_class: jetbrains-studio

  - name: clion
    url: https://download.jetbrains.com/cpp/CLion-2025.3.3.tar.gz
    archive_file: CLion-2025.3.3.tar.gz
    install_root: /opt/clion
    extracted_dir_name: clion-2025.3.3
    binary_relpath: bin/clion.sh
    command_name: clion
    min_free_mb: 8192
    enabled: "{{ desktop_managed_apps_enabled.clion | bool }}"
    desktop:
      name: CLion
      icon_relpath: bin/clion.svg
      categories: Development;IDE;
      startup_wm_class: jetbrains-clion

  - name: eclipse-ide
    url: "https://download.eclipse.org/technology/epp/downloads/release/{{ desktop_eclipse_ide.release | replace('-R', '/R') }}/{{ desktop_eclipse_ide.linux_archive_file }}"
    archive_file: "{{ desktop_eclipse_ide.linux_archive_file }}"
    install_root: /opt/eclipse
    release_dir_name: "eclipse-{{ desktop_eclipse_ide.release }}"
    extracted_dir_name: eclipse
    binary_relpath: eclipse
    command_name: eclipse
    min_free_mb: 4096
    enabled: "{{ desktop_managed_apps_enabled.eclipse_ide | bool }}"
    unarchive_extra_opts:
      - --strip-components=1
    desktop:
      name: Eclipse IDE
      icon_relpath: icon.xpm
      categories: Development;IDE;

  - name: arduino-ide
    url: https://github.com/arduino/arduino-ide/releases/download/2.3.8/arduino-ide_2.3.8_Linux_64bit.zip
    archive_file: arduino-ide_2.3.8_Linux_64bit.zip
    install_root: /opt/arduino-ide
    extracted_dir_name: arduino-ide_2.3.8_Linux_64bit
    binary_relpath: arduino-ide
    command_name: arduino-ide
    min_free_mb: 2048
    enabled: "{{ desktop_managed_apps_enabled.arduino_ide | bool }}"
    post_extract_permissions:
      - path: arduino-ide
        mode: "0755"
      - path: chrome-sandbox
        mode: "4755"
    desktop:
      name: Arduino IDE
      icon_relpath: resources/app/resources/icons/512x512.png
      categories: Development;IDE;Electronics;

  - name: postman
    url: https://dl.pstmn.io/download/latest/linux64
    archive_file: postman-latest.tar.gz
    install_root: /opt/postman
    release_dir_name: "{{ desktop_postman.release_dir_name }}"
    extracted_dir_name: Postman
    binary_relpath: Postman
    command_name: postman
    enabled: "{{ desktop_managed_apps_enabled.postman | bool }}"
    refresh_release_on_download_change: true
    unarchive_extra_opts:
      - --strip-components=1
    desktop:
      name: Postman
      icon_relpath: app/resources/app/assets/icon.png
      categories: Development;Network;

  - name: intellij-idea-community
    url: https://download.jetbrains.com/idea/ideaIC-2025.1.1.tar.gz
    archive_file: ideaIC-2025.1.1.tar.gz
    install_root: /opt/intellij-idea-community
    extracted_dir_name: idea-IC-251.25410.109
    binary_relpath: bin/idea.sh
    command_name: idea
    enabled: "{{ desktop_managed_apps_enabled.intellij_idea_community | bool }}"
    desktop:
      name: IntelliJ IDEA Community
      icon_relpath: bin/idea.svg
      categories: Development;IDE;
      startup_wm_class: jetbrains-idea

  - name: pycharm-community
    url: https://download.jetbrains.com/python/pycharm-community-2025.1.tar.gz
    archive_file: pycharm-community-2025.1.tar.gz
    install_root: /opt/pycharm-community
    extracted_dir_name: pycharm-community-2025.1
    binary_relpath: bin/pycharm.sh
    command_name: pycharm
    enabled: "{{ desktop_managed_apps_enabled.pycharm_community | bool }}"
    desktop:
      name: PyCharm Community
      icon_relpath: bin/pycharm.svg
      categories: Development;IDE;
      startup_wm_class: jetbrains-pycharm-ce

  - name: esper
    url: https://esper.espertech.com/distributions/esper-9.0.0.tar.gz
    archive_file: esper-9.0.0.tar.gz
    install_root: /opt/esper
    extracted_dir_name: esper-9.0.0
    min_free_mb: 1024
    enabled: "{{ desktop_managed_apps_enabled.esper | bool }}"

# Aplicativos distribuídos por instaladores shell
desktop_shell_apps:
  - name: anaconda
    url: "https://repo.anaconda.com/archive/{{ desktop_anaconda.installer_filename }}"
    installer_filename: "{{ desktop_anaconda.installer_filename }}"
    install_root: /opt/anaconda3
    release_dir_name: "{{ desktop_anaconda.release_dir_name }}"
    creates_relpath: bin/conda
    command_argv:
      - /bin/bash
      - "/var/cache/desktop-software/{{ desktop_anaconda.installer_filename }}"
      - -b
      - -p
      - "/opt/anaconda3/releases/{{ desktop_anaconda.release_dir_name }}"
    enabled: "{{ desktop_managed_apps_enabled.anaconda | bool }}"
    symlinks:
      - source_command: conda
        command_name: conda
      - source_command: anaconda-navigator
        command_name: anaconda-navigator

# Aplicativos distribuídos como pacotes .deb avulsos
desktop_deb_apps:
  - name: mqttx
    url: "https://github.com/emqx/MQTTX/releases/download/v{{ desktop_mqttx.version }}/{{ desktop_mqttx.deb_filename }}"
    filename: "{{ desktop_mqttx.deb_filename }}"
    enabled: "{{ desktop_managed_apps_enabled.mqttx | bool }}"
    command_name: mqttx
    command_path: /usr/bin/mqttx
    desktop:
      name: MQTTX
      categories: Development;Network;
      icon_path: /usr/share/icons/hicolor/0x0/apps/mqttx.png
      startup_wm_class: MQTTX
