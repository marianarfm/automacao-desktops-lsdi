---
- name: Remove managed APT packages marked absent
  ansible.builtin.apt:
    name: "{{ desktop_absent_apt_packages | default([], true) }}"
    state: absent
    purge: true
    update_cache: true
    cache_valid_time: "{{ desktop_cache_valid_time }}"
  when:
    - (desktop_absent_apt_packages | default([], true)) | length > 0
    - not (
        ansible_check_mode and
        (
          (desktop_repo_keys.changed | default(false)) or
          (desktop_repo_defs.changed | default(false))
        )
      )
